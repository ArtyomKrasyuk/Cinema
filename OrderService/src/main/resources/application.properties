spring.application.name=OrderService
server.port=0

spring.datasource.url=jdbc:postgresql://localhost:5432/cinema
spring.datasource.username=admin
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database=postgresql
spring.jpa.hibernate.ddl-auto=none

eureka.client.service-url.defaultZone=http://localhost:8081/eureka

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=payment-result-events
spring.kafka.consumer.properties.spring.json.trusted.packages=*

app.kafka.process.payment.topic=process-payment-event-topic
app.kafka.payment.succeeded.topic=payment-succeeded-event-topic
app.kafka.payment.failed.topic=payment-failed-event-topic
app.kafka.refund.event.topic=refund-event-topic