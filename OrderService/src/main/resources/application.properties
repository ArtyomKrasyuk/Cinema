spring.application.name=OrderService
server.port=0

spring.datasource.url=jdbc:postgresql://localhost:5432/cinema
spring.datasource.username=admin
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database=postgresql
spring.jpa.hibernate.ddl-auto=none

eureka.client.service-url.defaultZone=http://localhost:8081/eureka

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=payment-result-events

app.kafka.process.payment.topic=process-payment-event-topic
app.kafka.payment.succeeded.topic=payment-succeeded-event-topic
app.kafka.payment.failed.topic=payment-failed-event-topic
app.kafka.refund.event.topic=refund-event-topic
app.kafka.refund.succeeded.topic=refund-succeeded-event-topic
app.kafka.refund.failed.topic=refund-failed-event-topic

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/Cinema
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs